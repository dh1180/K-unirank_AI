services:
  ai:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    environment:
      RAG_DB_PATH: /data/official_documents.sqlite3
    volumes:
      - rag_data:/data

volumes:
  rag_data:
